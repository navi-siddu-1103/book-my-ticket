<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Show - BookMyTicket Admin</title>

<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">

<style>
:root {
	--bg-main: #0f172a;
	--bg-card: #111827;
	--border-soft: #1f2937;
	--text-main: #e5e7eb;
	--text-muted: #9ca3af;
	--accent: #e74c3c;
	--accent-2: #22c55e;
}

* {
	box-sizing: border-box;
	margin: 0;
	padding: 0;
}

body {
	font-family: "Poppins", sans-serif;
	background: radial-gradient(circle at top, #1e293b, var(--bg-main));
	min-height: 100vh;
	display: flex;
	align-items: flex-start;
	justify-content: center;
	color: var(--text-main);
	padding: 20px 16px;
}

/* Container */
.form-container {
	width: 100%;
	max-width: 500px;
	padding: 20px 0;
}

/* Card */
.form-card {
	background: linear-gradient(180deg, #111827, #0b1220);
	border-radius: 18px;
	border: 1px solid var(--border-soft);
	box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
	padding: 20px 18px;
	animation: fadeInUp 0.6s ease;
}

/* Heading */
.form-card h1 {
	text-align: center;
	font-weight: 800;
	font-size: 1.4rem;
	margin-bottom: 26px;
	letter-spacing: 0.4px;
}

/* Form Group */
.form-group {
	margin-bottom: 18px;
}

label {
	font-weight: 600;
	font-size: 0.88rem;
	margin-bottom: 6px;
	display: block;
	color: var(--text-main);
}

/* Inputs */
.form-control, .form-select {
	width: 100%;
	background: #020617;
	border: 1px solid var(--border-soft);
	color: var(--text-main);
	border-radius: 10px;
	padding: 10px 12px;
	font-size: 0.88rem;
	transition: all 0.25s ease;
}

.form-control:focus, .form-select:focus {
	border-color: var(--accent);
	box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.25);
	outline: none;
	background: #020617;
	color: var(--text-main);
}

.form-control::placeholder {
	color: var(--text-muted);
}

.form-select option {
	background: #020617;
	color: var(--text-main);
}

/* Error text */
.error-text {
	color: #f87171;
	font-size: 0.78rem;
	font-weight: 600;
	margin-top: 4px;
	display: block;
}

/* Button */
.btn-submit {
	width: 100%;
	background: linear-gradient(135deg, #e74c3c, #ff6b6b);
	border: none;
	color: white;
	font-weight: 700;
	padding: 12px;
	border-radius: 12px;
	font-size: 0.95rem;
	transition: all 0.25s ease;
	margin-top: 10px;
	cursor: pointer;
}

.btn-submit:hover {
	transform: translateY(-2px);
	box-shadow: 0 14px 35px rgba(231, 76, 60, 0.45);
}

/* Animations */
@keyframes fadeInUp {
	from { opacity: 0; transform: translateY(20px); }
	to   { opacity: 1; transform: translateY(0); }
}

.back-link {
	text-align: center;
	margin-top: 18px;
}

.back-link a {
	color: var(--text-muted);
	text-decoration: none;
	font-size: 0.9rem;
	font-weight: 600;
	transition: color 0.2s ease;
}

.back-link a:hover {
	color: var(--accent);
}

/* ===== TABLET (≥576px) ===== */
@media (min-width: 576px) {
	.form-card {
		padding: 30px 28px;
	}
	.form-card h1 {
		font-size: 1.5rem;
	}
}

/* ===== DESKTOP (≥768px) ===== */
@media (min-width: 768px) {
	body {
		align-items: center;
	}
	.form-container {
		padding: 0;
	}
	.form-card {
		padding: 40px;
	}
	.form-card h1 {
		font-size: 1.6rem;
		margin-bottom: 30px;
	}
}

/* ===== MOBILE ONLY (≤480px) ===== */
@media (max-width: 480px) {
	.form-card {
		padding: 20px 16px;
		border-radius: 14px;
	}
	.form-card h1 {
		font-size: 1.25rem;
	}
}
</style>
</head>

<body>

	<div class="form-container">
		<div class="form-card">

			<h1>🎥 Add Show</h1>

			<form action="/add-show" method="post" th:object="${showDto}">

				<input type="hidden" th:field="*{screenId}">

				<div class="form-group">
					<label>Show Date</label>
					<input type="date" class="form-control" th:field="*{showDate}">
					<span class="error-text" th:errors="*{showDate}"></span>
				</div>

				<div class="form-group">
					<label>Show Start Time</label>
					<input type="time" class="form-control" th:field="*{startTime}">
					<span class="error-text" th:errors="*{startTime}"></span>
				</div>

				<div class="form-group">
					<label>Select Movie</label>
					<select class="form-select" th:field="*{movieId}">
						<option value="">-- Select Movie --</option>
						<option th:each="movie : ${movies}" th:value="${movie.id}" th:text="${movie.name}"></option>
					</select>
					<span class="error-text" th:errors="*{movieId}"></span>
				</div>

				<div class="form-group">
					<label>Ticket Price (₹)</label>
					<input type="number" class="form-control" th:field="*{ticketPrice}" placeholder="e.g. 250">
					<span class="error-text" th:errors="*{ticketPrice}"></span>
				</div>

				<button type="submit" class="btn-submit">Add Show</button>

				<div class="back-link">
					<a th:href="'/manage-shows/' + *{screenId}">← Back to Shows</a>
				</div>

			</form>

		</div>
	</div>

</body>
</html>
