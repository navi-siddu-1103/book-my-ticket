<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Seats | BookMyTicket</title>

<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
	rel="stylesheet">

<style>
:root {
	--bg-main: #0f172a;
	--border-soft: #1f2937;
	--text-main: #e5e7eb;
	--text-muted: #9ca3af;
}

* {
	box-sizing: border-box;
}

body {
	font-family: 'Poppins', sans-serif;
	background: radial-gradient(circle at top, #1e293b, #0f172a);
	min-height: 100vh;
	color: #e5e7eb;
}

.container {
	max-width: 1100px;
	margin-top: 40px;
	padding-left: 16px;
	padding-right: 16px;
}

/* Screen bar */
.screen {
	background: linear-gradient(135deg, #6496ff, #ff4081);
	color: white;
	text-align: center;
	padding: 12px;
	border-radius: 10px;
	font-weight: 700;
	letter-spacing: 2px;
	margin-bottom: 40px;
	width: 100%;
}

/* Seat rows */
.row-wrapper {
	display: flex;
	align-items: center;
	margin-bottom: 10px;
	min-width: max-content;
}

.row-name {
	width: 50px;
	min-width: 50px;
	font-weight: 700;
	color: #9ca3af;
	font-size: 0.9rem;
	flex-shrink: 0;
}

/* Overflow wrapper for the entire seat grid */
.seat-grid-scroll {
	overflow-x: auto;
	-webkit-overflow-scrolling: touch;
	padding-bottom: 10px;
	width: 100%;
}

/* Seat */
.seat {
	width: 36px;
	height: 36px;
	margin: 3px;
	border-radius: 6px;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	font-size: 0.7rem;
	font-weight: 600;
	cursor: pointer;
	user-select: none;
	flex-shrink: 0;
}

/* Categories */
.STANDARD {
	background: #e3f2fd;
	border: 1px solid #64b5f6;
	color: #1a237e;
}

.PREMIUM {
	background: #fff3cd;
	border: 1px solid #ffca28;
	color: #5d4037;
}

.VIP {
	background: #f8d7da;
	border: 1px solid #f44336;
	color: #7b1a1a;
}

/* States */
.booked {
	background: #374151 !important;
	border: none !important;
	cursor: not-allowed;
	color: #6b7280 !important;
}

.selected {
	background: #2ecc71 !important;
	color: white !important;
	border: none !important;
}

/* Legend */
.legend {
	display: flex;
	flex-wrap: wrap;
	gap: 14px 20px;
	justify-content: center;
	margin-top: 30px;
	font-weight: 600;
}

.legend span {
	display: flex;
	align-items: center;
	gap: 6px;
	font-size: 0.9rem;
}

.legend-box {
	width: 18px;
	height: 18px;
	border-radius: 4px;
	flex-shrink: 0;
}

/* Action buttons */
.action-bar {
	display: flex;
	justify-content: flex-end;
	gap: 10px;
	margin-top: 1.5rem;
}

/* ── Tablet ─────────────────────────── */
@media (max-width: 768px) {
	.container {
		margin-top: 24px;
	}
}

/* ── Mobile ─────────────────────────── */
@media (max-width: 576px) {
	.seat {
		width: 28px;
		height: 28px;
		margin: 2px;
		font-size: 0.6rem;
	}

	.row-name {
		width: 35px;
		min-width: 35px;
		font-size: 0.78rem;
	}

	.legend span {
		font-size: 0.78rem;
	}

	.legend-box {
		width: 14px;
		height: 14px;
	}

	.action-bar {
		flex-direction: column;
	}

	.action-bar .btn {
		width: 100%;
		text-align: center;
	}

	.screen {
		font-size: 0.8rem;
		letter-spacing: 1px;
		padding: 10px 8px;
	}
}
</style>
</head>

<body>

	<div class="container">

		<div class="screen">🎬 SCREEN THIS SIDE 🎬</div>

		<form id="bookingForm" action="/confirm-booking" method="post"
			onsubmit="return prepareSeats()">

			<input type="hidden" name="showId" th:value="${showId}">

			<!-- Seat grid scroll wrapper -->
			<div class="seat-grid-scroll">

				<!-- ROW LOOP -->
				<div th:each="rowEntry : ${seatsByRow}">
					<div class="row-wrapper">

						<!-- Row Label -->
						<div class="row-name" th:text="${rowEntry.key}"></div>

						<!-- Seats in a single non-wrapping row -->
						<div style="display:flex; flex-wrap:nowrap;">
							<div th:each="showSeat : ${rowEntry.value}" class="seat"
								th:classappend="${showSeat.seat.category} + (${showSeat.booked} ? ' booked' : '')"
								th:text="${showSeat.seat.seatColumn}"
								th:data-id="${showSeat.id}"
								onclick="toggleSeat(this)"></div>
						</div>

					</div>
				</div>

			</div><!-- /seat-grid-scroll -->

			<!-- Legend -->
			<div class="legend">
				<span><div class="legend-box STANDARD"></div>Standard</span>
				<span><div class="legend-box PREMIUM"></div>Premium</span>
				<span><div class="legend-box VIP"></div>VIP</span>
				<span><div class="legend-box" style="background: #374151; border:1px solid #6b7280"></div>Booked</span>
				<span><div class="legend-box" style="background: #2ecc71"></div>Selected</span>
			</div>

			<!-- Actions -->
			<div class="action-bar">
				<a href="/" class="btn btn-secondary">Back</a>
				<button type="submit" class="btn btn-success">Proceed</button>
			</div>

		</form>

	</div>

	<script>
function toggleSeat(el) {
	if (el.classList.contains('booked')) return;
	el.classList.toggle('selected');
}

function prepareSeats() {
	const selected = document.querySelectorAll('.seat.selected');

	if (selected.length === 0) {
		alert("Please select at least one seat");
		return false;
	}

	// Remove any previously added dynamic inputs
	document.querySelectorAll('.dynamic-seat-input').forEach(e => e.remove());

	const form = document.getElementById('bookingForm');
	selected.forEach(seat => {
		const input = document.createElement('input');
		input.type = 'hidden';
		input.name = 'seatIds';
		input.value = seat.dataset.id;
		input.className = 'dynamic-seat-input';
		form.appendChild(input);
	});

	return true;
}
	</script>

</body>

</html>
