<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ticket Confirmation | BookMyTicket</title>

<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap"
	rel="stylesheet">

<style>
:root {
	--bg-main: #0f172a;
	--bg-card: #111827;
	--border: #1f2937;
	--text-main: #e5e7eb;
	--text-muted: #9ca3af;
	--accent: #6496ff;
	--accent-pink: #ff4081;
	--success: #22c55e;
}

body {
	font-family: 'Poppins', sans-serif;
	background: radial-gradient(circle at top, #1e293b, var(--bg-main));
	color: var(--text-main);
	min-height: 100vh;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 30px 15px;
}

.ticket-wrapper {
	width: 100%;
	max-width: 580px;
	animation: fadeInUp 0.6s ease;
}

.success-badge {
	text-align: center;
	margin-bottom: 25px;
}

.success-badge .icon {
	width: 64px;
	height: 64px;
	background: rgba(34, 197, 94, 0.15);
	border: 2px solid var(--success);
	color: var(--success);
	border-radius: 50%;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	font-size: 2rem;
	margin-bottom: 12px;
}

.success-badge h2 {
	font-weight: 900;
	font-size: 1.7rem;
	background: linear-gradient(135deg, #22c55e, #4ade80);
	-webkit-background-clip: text;
	-webkit-text-fill-color: transparent;
}

.success-badge p {
	color: var(--text-muted);
	font-size: 0.95rem;
}

.ticket-card {
	background: linear-gradient(180deg, #111827, #0b1220);
	border: 1px solid var(--border);
	border-radius: 20px;
	overflow: hidden;
	box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7);
}

.ticket-header {
	background: linear-gradient(135deg, var(--accent), var(--accent-pink));
	padding: 22px 25px;
	color: white;
}

.ticket-header h4 {
	font-weight: 800;
	font-size: 1.4rem;
	margin-bottom: 4px;
}

.ticket-header p {
	font-size: 0.9rem;
	opacity: 0.9;
	margin: 0;
}

.ticket-body {
	padding: 25px;
}

.info-grid {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 15px;
	margin-bottom: 20px;
}

.info-item .label {
	color: var(--text-muted);
	font-size: 0.78rem;
	font-weight: 600;
	text-transform: uppercase;
	letter-spacing: 0.5px;
}

.info-item .value {
	font-weight: 700;
	font-size: 1rem;
	margin-top: 2px;
}

.seat-tag {
	display: inline-block;
	background: rgba(100, 150, 255, 0.15);
	border: 1px solid var(--accent);
	color: var(--accent);
	padding: 3px 10px;
	border-radius: 6px;
	font-weight: 700;
	font-size: 0.85rem;
	margin: 2px;
}

.divider {
	border-top: 1px dashed var(--border);
	margin: 20px 0;
	position: relative;
}

.divider::before, .divider::after {
	content: '';
	position: absolute;
	width: 20px;
	height: 20px;
	background: radial-gradient(circle at top, #1e293b, var(--bg-main));
	border-radius: 50%;
	top: -10px;
}

.divider::before { left: -35px; }
.divider::after { right: -35px; }

.qr-section {
	text-align: center;
	padding: 10px 0;
}

.qr-section img {
	width: 140px;
	height: 140px;
	border-radius: 12px;
	border: 2px solid var(--border);
	background: white;
	padding: 6px;
}

.qr-section p {
	color: var(--text-muted);
	font-size: 0.8rem;
	margin-top: 8px;
}

.actions {
	display: flex;
	gap: 12px;
	margin-top: 25px;
}

.btn-home {
	flex: 1;
	background: #020617;
	border: 1px solid var(--border);
	color: var(--text-muted);
	padding: 12px;
	border-radius: 12px;
	font-weight: 600;
	text-decoration: none;
	text-align: center;
	transition: all 0.25s ease;
}

.btn-home:hover {
	color: white;
	border-color: #334155;
}

.btn-bookings {
	flex: 1;
	background: linear-gradient(135deg, var(--accent), var(--accent-pink));
	color: white;
	padding: 12px;
	border-radius: 12px;
	font-weight: 700;
	text-decoration: none;
	text-align: center;
	border: none;
	box-shadow: 0 10px 25px rgba(100, 150, 255, 0.4);
	transition: all 0.25s ease;
}

.btn-bookings:hover {
	transform: translateY(-2px);
	box-shadow: 0 15px 35px rgba(100, 150, 255, 0.55);
	color: white;
}

@keyframes fadeInUp {
	from { opacity: 0; transform: translateY(20px); }
	to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 576px) {
	.ticket-body {
		padding: 18px;
	}
	.info-grid {
		grid-template-columns: 1fr;
		gap: 10px;
	}
	.actions {
		flex-direction: column;
	}
	.btn-home, .btn-bookings {
		width: 100%;
	}
}
</style>
</head>

<body>

<div class="ticket-wrapper">

	<!-- SUCCESS BADGE -->
	<div class="success-badge">
		<div class="icon">✓</div>
		<h2>Booking Confirmed!</h2>
		<p>Your tickets have been sent to your registered email.</p>
	</div>

	<!-- TICKET CARD -->
	<div class="ticket-card" th:if="${ticket != null}">

		<div class="ticket-header">
			<h4 th:text="${ticket.movieName}">Movie Name</h4>
			<p th:text="${ticket.theaterName} + ' • ' + ${ticket.screenName}">Theater • Screen</p>
		</div>

		<div class="ticket-body">

			<div class="info-grid">
				<div class="info-item">
					<div class="label">Date</div>
					<div class="value" th:text="${ticket.showDate}">Date</div>
				</div>
				<div class="info-item">
					<div class="label">Show Time</div>
					<div class="value" th:text="${ticket.showTiming}">Timing</div>
				</div>
				<div class="info-item">
					<div class="label">Seats</div>
					<div class="value">
						<span th:each="s : ${ticket.seatNumber}" class="seat-tag" th:text="${s}">A1</span>
					</div>
				</div>
				<div class="info-item">
					<div class="label">Total Paid</div>
					<div class="value" style="color: var(--success);" th:text="'₹ ' + ${ticket.ticketPrice}">₹ 500</div>
				</div>
				<div class="info-item" th:if="${ticket.paymentId != null}">
					<div class="label">Payment ID</div>
					<div class="value" style="font-size: 0.8rem; word-break: break-all;" th:text="${ticket.paymentId}">pay_xxx</div>
				</div>
				<div class="info-item">
					<div class="label">Tickets Count</div>
					<div class="value" th:text="${ticket.ticketCount}">2</div>
				</div>
			</div>

			<div class="divider" th:if="${ticket.qrUrl != null}"></div>

			<!-- QR CODE -->
			<div class="qr-section" th:if="${ticket.qrUrl != null}">
				<img th:src="${ticket.qrUrl}" alt="Ticket QR Code">
				<p>Scan at theatre entrance</p>
			</div>

		</div>

	</div>

	<!-- ACTION BUTTONS -->
	<div class="actions">
		<a href="/" class="btn-home">← Back to Home</a>
		<a href="/bookings" class="btn-bookings">View All Bookings</a>
	</div>

</div>

</body>
</html>
