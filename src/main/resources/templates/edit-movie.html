<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Movie - BookMyTicket Admin</title>

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<!-- Bootstrap -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- Google Font -->
<link
	href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;900&display=swap"
	rel="stylesheet">

<style>
:root {
	--bg-main: #0f172a;
	--bg-card: #111827;
	--border-soft: #1f2937;
	--text-main: #e5e7eb;
	--text-muted: #9ca3af;
	--accent: #6496ff;
	--accent-pink: #ff4081;
	--danger: #ef4444;
}

* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	font-family: "Poppins", sans-serif;
	background: radial-gradient(circle at top, #1e293b, var(--bg-main));
	min-height: 100vh;
	display: flex;
	align-items: center;
	justify-content: center;
	color: var(--text-main);
	padding: 20px;
}

/* Container */
.form-container {
	width: 100%;
	display: flex;
	justify-content: center;
	align-items: center;
}

/* Card */
.form-box {
	width: 100%;
	max-width: 580px;
	padding: 45px;
	background: linear-gradient(180deg, #111827, #0b1220);
	border-radius: 18px;
	border: 1px solid var(--border-soft);
	box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
	animation: fadeInUp 0.6s ease;
}

h1 {
	text-align: center;
	margin-bottom: 30px;
	font-weight: 800;
	font-size: 1.9rem;
	letter-spacing: 0.5px;
}

/* Current Poster Preview */
.current-poster-preview {
	display: flex;
	align-items: center;
	gap: 16px;
	background: rgba(2, 6, 23, 0.6);
	border: 1px solid var(--border-soft);
	border-radius: 12px;
	padding: 12px 16px;
	margin-bottom: 22px;
}

.current-poster-preview img {
	width: 60px;
	height: 80px;
	object-fit: cover;
	border-radius: 8px;
	border: 1px solid rgba(255, 255, 255, 0.1);
}

.current-poster-info h6 {
	margin: 0 0 4px 0;
	font-weight: 600;
	font-size: 0.95rem;
}

.current-poster-info span {
	font-size: 0.8rem;
	color: var(--text-muted);
	word-break: break-all;
}

/* Form */
.form-group {
	margin-bottom: 20px;
}

label {
	margin-bottom: 6px;
	font-weight: 600;
	color: var(--text-main);
	font-size: 0.9rem;
}

.form-control, .form-file {
	background: #020617;
	border: 1px solid var(--border-soft);
	border-radius: 10px;
	padding: 11px 14px;
	color: var(--text-main);
	font-size: 0.9rem;
	transition: all 0.25s ease;
}

.form-control::placeholder {
	color: #64748b;
}

.form-control:focus, .form-file:focus {
	border-color: var(--accent);
	box-shadow: 0 0 0 3px rgba(100, 150, 255, 0.25);
	outline: none;
	background: #020617;
	color: #fff;
}

/* Buttons */
.button-group {
	display: flex;
	gap: 15px;
	margin-top: 30px;
}

.btn-submit {
	flex: 1;
	background: linear-gradient(135deg, var(--accent), var(--accent-pink));
	color: #fff;
	border: none;
	padding: 13px;
	border-radius: 12px;
	font-weight: 700;
	cursor: pointer;
	box-shadow: 0 10px 25px rgba(100, 150, 255, 0.4);
	transition: all 0.25s ease;
}

.btn-submit:hover {
	transform: translateY(-2px);
	box-shadow: 0 15px 35px rgba(100, 150, 255, 0.6);
}

.btn-cancel {
	flex: 1;
	background: #1f2937;
	color: var(--text-main);
	border: 1px solid var(--border-soft);
	padding: 13px;
	border-radius: 12px;
	font-weight: 600;
	text-align: center;
	text-decoration: none;
	transition: all 0.25s ease;
}

.btn-cancel:hover {
	background: #374151;
	color: #fff;
}

/* Validation */
.error-text {
	color: var(--danger);
	font-size: 0.8rem;
	margin-top: 5px;
	display: block;
}

/* Back Button */
.back-btn {
	display: inline-flex;
	align-items: center;
	gap: 6px;
	color: var(--text-muted);
	text-decoration: none;
	font-size: 0.88rem;
	font-weight: 600;
	margin-bottom: 20px;
	transition: color 0.2s ease;
}

.back-btn:hover {
	color: var(--accent);
}

@media (max-width: 768px) {
	.form-box {
		padding: 25px 18px;
	}
	.button-group {
		flex-direction: column;
	}
}
</style>
</head>

<body>

	<div class="form-container">
		<div class="form-box">
			<!-- Back Button -->
			<a href="/manage-movies" class="back-btn">
				&#8592; Back to Movies
			</a>
			<h1>🎬 Edit Movie</h1>

			<!-- Current Poster Thumbnail -->
			<div class="current-poster-preview" th:if="${currentImageLink}">
				<img th:src="${currentImageLink}" alt="Current Poster"
					onerror="this.onerror=null;this.src='https://placehold.co/120x160/e5e7eb/64748b?text=No+Poster';">
				<div class="current-poster-info">
					<h6>Current Poster</h6>
					<span th:text="${currentImageLink}"></span>
				</div>
			</div>

			<form th:action="'/edit-movie/' + ${id}" method="post" th:object="${movieDto}"
				enctype="multipart/form-data">

				<div class="form-group">
					<label>Movie Name *</label> <input class="form-control"
						th:field="*{name}" placeholder="Enter movie name"> <span
						class="error-text" th:errors="*{name}"></span>
				</div>

				<div class="form-group">
					<label>Genre *</label> <input class="form-control"
						th:field="*{genre}" placeholder="Action, Drama"> <span
						class="error-text" th:errors="*{genre}"></span>
				</div>

				<div class="form-group">
					<label>Languages *</label> <input class="form-control"
						th:field="*{languages}" placeholder="English, Hindi"> <span
						class="error-text" th:errors="*{languages}"></span>
				</div>

				<div class="form-group">
					<label>Duration *</label> <input type="time" class="form-control"
						th:field="*{duration}"> <span class="error-text"
						th:errors="*{duration}"></span>
				</div>

				<div class="form-group">
					<label>Poster Image (Optional - Upload to Replace)</label>
					<input type="file" class="form-file" th:field="*{image}" accept="image/*">
					<div class="mt-2">
						<label class="text-muted" style="font-size: 0.82rem;">Or Enter Poster Image URL</label>
						<input class="form-control" th:field="*{imageUrl}" placeholder="https://image.tmdb.org/t/p/w500/...jpg">
						<small class="text-muted d-block mt-1">Leave empty to keep the existing poster</small>
					</div>
				</div>

				<div class="form-group">
					<label>Trailer Link</label> <input class="form-control"
						th:field="*{trailerLink}" placeholder="https://youtube.com/...">
				</div>

				<div class="form-group">
					<label>Description *</label>
					<textarea class="form-control" rows="3" th:field="*{description}"></textarea>
					<span class="error-text" th:errors="*{description}"></span>
				</div>

				<div class="form-group">
					<label>Release Date *</label> <input type="date"
						class="form-control" th:field="*{releaseDate}"> <span
						class="error-text" th:errors="*{releaseDate}"></span>
				</div>

				<div class="form-group">
					<label>Cast *</label> <input class="form-control"
						th:field="*{cast}" placeholder="Actor 1, Actor 2"> <span
						class="error-text" th:errors="*{cast}"></span>
				</div>

				<div class="button-group">
					<button class="btn-submit">Save Changes</button>
					<a href="/manage-movies" class="btn-cancel">Cancel</a>
				</div>

			</form>
		</div>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
