<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Seats | BookMyTicket</title>

<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap"
	rel="stylesheet">

<style>
:root {
	--bg-main: #0f172a;
	--bg-card: #111827;
	--border: #1f2937;
	--text-main: #e5e7eb;
	--text-muted: #9ca3af;
	--standard: #60a5fa;
	--premium: #fbbf24;
	--vip: #f87171;
}

/* ===== GLOBAL ===== */
body {
	font-family: "Poppins", sans-serif;
	background: radial-gradient(circle at top, #1e293b, var(--bg-main));
	color: var(--text-main);
	min-height: 100vh;
	padding: 0 0 40px;
}

.container {
	max-width: 1200px;
	margin-top: 30px;
	padding: 0 15px;
}

/* ===== SCREEN ===== */
.screen-label {
	text-align: center;
	font-weight: 900;
	margin-bottom: 30px;
	padding: 12px;
	letter-spacing: 3px;
	border-radius: 14px;
	background: linear-gradient(180deg, #1e293b, #020617);
	border: 1px solid var(--border);
	box-shadow: 0 20px 50px rgba(0, 0, 0, .7);
	color: #c7d2fe;
	font-size: .95rem;
}

/* ===== SEAT GRID WRAPPER ===== */
.seat-scroll-container {
	overflow-x: auto;
	-webkit-overflow-scrolling: touch;
	padding-bottom: 15px;
}

/* ===== ROW ===== */
.row-wrapper {
	display: flex;
	align-items: center;
	margin-bottom: 10px;
	min-width: max-content;
}

.row-name {
	width: 50px;
	font-weight: 700;
	color: var(--text-muted);
	font-size: .9rem;
	flex-shrink: 0;
}

/* ===== SEATS ===== */
.seat {
	width: 36px;
	height: 36px;
	border-radius: 8px;
	margin: 3px;
	display: flex;
	align-items: center;
	justify-content: center;
	font-size: .75rem;
	font-weight: 700;
	cursor: default;
	box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .3);
	transition: all .2s ease;
	flex-shrink: 0;
}

/* Seat Types */
.STANDARD {
	background: rgba(96, 165, 250, .2);
	border: 1px solid var(--standard);
	color: var(--standard);
}

.PREMIUM {
	background: rgba(251, 191, 36, .2);
	border: 1px solid var(--premium);
	color: var(--premium);
}

.VIP {
	background: rgba(248, 113, 113, .2);
	border: 1px solid var(--vip);
	color: var(--vip);
}

.seat:hover {
	transform: translateY(-2px);
	box-shadow: 0 8px 20px rgba(0, 0, 0, .5);
}

/* ===== ACTIONS ===== */
.actions {
	margin-top: 30px;
	display: flex;
	justify-content: flex-end;
	gap: 12px;
}

.btn-back {
	background: #020617;
	border: 1px solid var(--border);
	color: var(--text-muted);
	padding: .55rem 1.3rem;
	border-radius: 10px;
	font-weight: 600;
	text-decoration: none;
	display: inline-block;
}

.btn-back:hover {
	color: #fff;
	border-color: #334155;
}

/* ===== EMPTY STATE ===== */
.empty-state {
	text-align: center;
	padding: 70px 20px;
	background: linear-gradient(180deg, #111827, #0b1220);
	border-radius: 18px;
	border: 1px solid var(--border);
	box-shadow: 0 25px 60px rgba(0, 0, 0, .6);
}

.empty-state h3 {
	font-weight: 900;
	margin-bottom: 10px;
}

.empty-state p {
	color: var(--text-muted);
	margin-bottom: 25px;
}

.btn-create {
	background: linear-gradient(135deg, #6496ff, #ff4081);
	color: #fff;
	font-weight: 700;
	padding: .7rem 1.6rem;
	border-radius: 12px;
	box-shadow: 0 12px 30px rgba(100, 150, 255, .4);
	text-decoration: none;
	display: inline-block;
}

.btn-create:hover {
	transform: translateY(-2px);
	box-shadow: 0 20px 45px rgba(100, 150, 255, .55);
	color: #fff;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 576px) {
	.container {
		margin-top: 15px;
		padding: 0 10px;
	}
	.screen-label {
		font-size: .8rem;
		letter-spacing: 1.5px;
		padding: 10px;
		margin-bottom: 20px;
	}
	.row-name {
		width: 36px;
		font-size: .8rem;
	}
	.seat {
		width: 28px;
		height: 28px;
		font-size: .65rem;
		margin: 2px;
		border-radius: 6px;
	}
	.actions {
		justify-content: stretch;
	}
	.btn-back {
		width: 100%;
		text-align: center;
	}
}
</style>
</head>

<body>

	<div class="container">

		<!-- ================= NO SEATS ================= -->
		<div th:if="${#maps.isEmpty(seatsByRow)}" class="empty-state">
			<h3>🎟️ No Seat Layout Found</h3>
			<p>This screen does not have a seat layout yet.</p>

			<a th:href="@{/add-seats/{id}(id=${screenId})}"
				class="btn btn-create">+ Create Seat Layout</a>
		</div>

		<!-- ================= SEATS EXIST ================= -->
		<div th:if="${!#maps.isEmpty(seatsByRow)}">

			<div class="screen-label">🎬 SCREEN THIS SIDE 🎬</div>

			<!-- SEAT GRID WITH HORIZONTAL SCROLL -->
			<div class="seat-scroll-container">
				<!-- ROWS -->
				<div th:each="rowEntry : ${seatsByRow}">
					<div class="row-wrapper">
						<div class="row-name" th:text="${rowEntry.key}"></div>

						<div class="d-flex flex-nowrap">
							<div th:each="seat : ${rowEntry.value}" class="seat"
								th:classappend="${seat.category}" th:text="${seat.seatColumn}">
							</div>
						</div>
					</div>
				</div>
			</div>

			<!-- ACTIONS -->
			<div class="actions">
				<a href="/manage-theaters" class="btn-back">← Back</a>
			</div>

		</div>

	</div>

</body>
</html>
