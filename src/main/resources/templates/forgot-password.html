<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | BookMyTicket</title>

<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap"
	rel="stylesheet">

<style>
:root {
	--bg-main: #0f172a;
	--bg-card: #111827;
	--border-soft: #1f2937;
	--text-main: #e5e7eb;
	--text-muted: #9ca3af;
	--accent: #6496ff;
	--accent-pink: #ff4081;
}

/* ===== GLOBAL ===== */
body {
	font-family: "Poppins", sans-serif;
	background: radial-gradient(circle at top, #1e293b, var(--bg-main));
	min-height: 100vh;
	color: var(--text-main);
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 20px 15px;
}

/* ===== CARD ===== */
.forgot-box {
	width: 100%;
	max-width: 420px;
	padding: 40px;
	background: linear-gradient(180deg, #111827, #0b1220);
	border-radius: 18px;
	border: 1px solid var(--border-soft);
	box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7);
	animation: fadeInUp 0.6s ease;
	text-align: center;
}

/* ===== TITLE ===== */
.forgot-box h3 {
	font-weight: 900;
	font-size: 1.8rem;
	margin-bottom: 10px;
	background: linear-gradient(135deg, var(--accent), var(--accent-pink));
	-webkit-background-clip: text;
	-webkit-text-fill-color: transparent;
}

.forgot-box p {
	color: var(--text-muted);
	font-size: 0.95rem;
	margin-bottom: 26px;
}

/* ===== INPUTS ===== */
.form-control {
	background: #020617;
	border: 1.5px solid var(--border-soft);
	border-radius: 12px;
	padding: 12px 16px;
	color: var(--text-main);
	font-weight: 500;
	transition: all 0.25s ease;
}

.form-control::placeholder {
	color: #64748b;
}

.form-control:focus {
	background: #020617;
	border-color: var(--accent);
	box-shadow: 0 0 0 3px rgba(100, 150, 255, 0.25);
	color: var(--text-main);
}

/* ===== BUTTON ===== */
.btn-primary {
	width: 100%;
	padding: 12px;
	border-radius: 12px;
	border: none;
	font-weight: 700;
	font-size: 0.95rem;
	background: linear-gradient(135deg, var(--accent), var(--accent-pink));
	box-shadow: 0 15px 35px rgba(100, 150, 255, 0.35);
	transition: all 0.3s ease;
}

.btn-primary:hover {
	transform: translateY(-2px);
	box-shadow: 0 20px 45px rgba(100, 150, 255, 0.5);
}

/* ===== LINKS ===== */
a {
	color: var(--accent);
	font-weight: 600;
	text-decoration: none;
	transition: color 0.2s ease;
}

a:hover {
	color: var(--accent-pink);
}

/* ===== TOASTS ===== */
.toastify-container {
	position: fixed;
	top: 20px;
	right: 20px;
	z-index: 9999;
	max-width: 320px;
	width: auto;
}

.toastify {
	width: auto;
	max-width: 320px;
	border-radius: 12px;
	padding: 12px 16px;
	color: white;
	font-weight: 600;
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 10px;
	box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
	animation: toastSlideIn 0.4s ease forwards;
	margin-bottom: 10px;
	font-size: 0.9rem;
}

.toastify.success {
	background: linear-gradient(135deg, #22c55e, #16a34a);
}

.toastify.error {
	background: linear-gradient(135deg, #ff4081, #ff6a6a);
}

.toastify-close {
	background: rgba(255, 255, 255, 0.25);
	border: none;
	color: white;
	width: 22px;
	height: 22px;
	border-radius: 50%;
	font-size: 0.85rem;
	cursor: pointer;
	display: flex;
	align-items: center;
	justify-content: center;
}

@keyframes toastSlideIn {
	from { opacity: 0; transform: translateX(300px); }
	to { opacity: 1; transform: translateX(0); }
}

@keyframes toastSlideOut {
	from { opacity: 1; transform: translateX(0); }
	to { opacity: 0; transform: translateX(300px); }
}

@keyframes fadeInUp {
	from { opacity: 0; transform: translateY(20px); }
	to { opacity: 1; transform: translateY(0); }
}

/* ===== RESPONSIVE ===== */
@media (max-width: 576px) {
	body {
		padding: 15px 12px;
	}
	.forgot-box {
		padding: 28px 18px;
		border-radius: 14px;
	}
	.forgot-box h3 {
		font-size: 1.55rem;
	}
	.toastify-container {
		top: 15px;
		right: 15px;
		left: 15px;
		max-width: none;
	}
}
</style>
</head>

<body>

	<!-- TOASTS -->
	<div class="toastify-container">
		<div th:if="${pass}" class="toastify success">
			<span th:text="${pass}"></span>
			<button class="toastify-close" onclick="this.parentElement.remove()">✕</button>
		</div>
		<div th:if="${fail}" class="toastify error">
			<span th:text="${fail}"></span>
			<button class="toastify-close" onclick="this.parentElement.remove()">✕</button>
		</div>
	</div>

	<!-- FORGOT PASSWORD CARD -->
	<div class="forgot-box">
		<h3>Forgot Password</h3>
		<p>Enter your registered email to receive an OTP</p>

		<form action="/forgot-password" method="post">
			<div class="mb-3">
				<input type="email" name="email" class="form-control"
					placeholder="📧 Email address" required>
			</div>

			<button class="btn btn-primary">Send OTP</button>
		</form>

		<div class="mt-4">
			<a href="/login">← Back to Login</a>
		</div>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

	<script>
	document.addEventListener("DOMContentLoaded", () => {
		const toasts = document.querySelectorAll('.toastify');
		toasts.forEach(t => {
			setTimeout(() => {
				if (document.body.contains(t)) {
					t.style.animation = 'toastSlideOut 0.3s ease forwards';
					setTimeout(() => t.remove(), 300);
				}
			}, 3500);
		});
	});
	</script>

</body>
</html>
